[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "speech-io-hub"
version = "0.3.1"
description = "STT/TTS service for the Fante project"
readme = "README.md"
requires-python = "==3.12.*"
authors = [
    {name = "Fernando Velasco", email = "fermaat.vl@gmail.com"},
]
license = {text = "MIT"}
dependencies = [
    "core-utils @ git+https://github.com/fermaat/core-utils.git",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.0",
    "httpx>=0.27",
    "faster-whisper>=1.1",
    "sounddevice>=0.5",
    "silero-vad>=5.1",
    "numpy>=2.0",
    "python-multipart>=0.0.9",
    "piper-tts>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "isort>=5.12",
]

[tool.pdm]
distribution = true

[tool.pdm.build]
includes = ["src/speech_io_hub"]

[tool.pdm.dev-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "isort>=5.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers -v"
asyncio_mode = "auto"
markers = [
    "unit: unit tests",
    "functional: functional / HTTP-via-TestClient tests",
    "integration: integration tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = [
    "core_utils.*",
    "faster_whisper.*",
    "sounddevice.*",
    "silero_vad.*",
    "piper.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
extend-select = ["E", "W", "F", "I", "C4", "B", "UP", "SIM"]
ignore = ["E501", "E203"]

[tool.ruff.lint.isort]
known-first-party = ["speech_io_hub", "core_utils"]

[tool.coverage.run]
source = ["src/speech_io_hub"]
omit = ["*/tests/*", "*/test_*.py", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
